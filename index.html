<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Petit Prono SIGMA</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #0f172a; color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
  h1 { color: #22c55e; margin: 30px 0; text-align: center; }
  .card { background: #1e293b; padding: 30px; border-radius: 12px; max-width: 400px; width: 100%; margin-bottom: 20px; }
  input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: none; font-size: 16px; }
  input.code { text-align: center; font-size: 24px; letter-spacing: 6px; }
  button { width: 100%; padding: 12px; background: #22c55e; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 10px; }
  button:hover { background: #16a34a; }
  button:disabled { background: #475569; cursor: not-allowed; }
  button.lien { background: none; color: #94a3b8; font-size: 14px; text-decoration: underline; }
  button.lien:hover { background: none; color: white; }
  .nav { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
  .nav a { color: white; text-decoration: none; background: #334155; padding: 10px 20px; border-radius: 6px; }
  .nav a:hover { background: #475569; }
  #message { text-align: center; margin-top: 10px; color: #fbbf24; }
  .info { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 10px; }
  .cache { display: none; }
</style>
</head>
<body>

<h1>🏆 Mon Petit Prono SIGMA</h1>

<div class="nav">
  <a href="pronostics.html">Pronostics</a>
  <a href="classement.html">Classement</a>
  <a href="admin.html">Admin</a>
</div>

<div class="card">
  <h2 style="margin-bottom: 15px;">Connexion étudiant</h2>

  <!-- Étape 1 : saisie du mail -->
  <div id="etape1">
    <p class="info">Entre ton adresse mail d'école pour recevoir un code de connexion.</p>
    <input type="email" id="email" placeholder="prenom.nom@ecole.fr">
    <button id="btnEmail" onclick="envoyerCode()">Recevoir mon code</button>
  </div>

  <!-- Étape 2 : saisie du code reçu par mail -->
  <div id="etape2" class="cache">
    <p class="info">
      📧 Un code a été envoyé à<br>
      <strong id="emailAffiche" style="color:white;"></strong><br><br>
      Entre-le ci-dessous (pense à vérifier les spams).
    </p>
    <input type="text" id="code" class="code" placeholder="00000000" maxlength="10" inputmode="numeric" autocomplete="one-time-code">
    <button id="btnCode" onclick="verifierCode()">Valider le code</button>
    <button class="lien" onclick="retourEtape1()">← Changer d'adresse mail</button>
  </div>

  <!-- Étape 3 : choix du pseudo (première connexion) -->
  <div id="etape3" class="cache">
    <p class="info">Bienvenue ! Choisis ton pseudo, il sera visible dans le classement.</p>
    <input type="text" id="pseudo" placeholder="Ton pseudo" maxlength="20">
    <button id="btnPseudo" onclick="validerPseudo()">Valider mon pseudo</button>
  </div>

  <p id="message"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://idsqkecgefrebswrvoja.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlkc3FrZWNnZWZyZWJzd3J2b2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4NTQ0MTIsImV4cCI6MjA5OTQzMDQxMn0.IwIGg7FgG1_bHrNIJbqjE3PUa0ZDD1eV2Vb0do3MlG8";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Domaine(s) mail autorisé(s)
  const DOMAINES_AUTORISES = ["sigma-clermont.fr"];

  // Empêche de traiter la session plusieurs fois
  let sessionTraitee = false;

  // Email en cours de connexion
  let emailEnCours = "";

  function afficherMessage(texte) {
    document.getElementById("message").textContent = texte;
  }

  function afficherEtape(numero) {
    ["etape1", "etape2", "etape3"].forEach((id, i) => {
      document.getElementById(id).classList.toggle("cache", i + 1 !== numero);
    });
    afficherMessage("");
  }

  function retourEtape1() {
    document.getElementById("code").value = "";
    afficherEtape(1);
  }

  function domaineValide(email) {
    const domaine = email.split("@")[1];
    return domaine && DOMAINES_AUTORISES.includes(domaine.toLowerCase());
  }

  // Étape 1 : envoi du code par mail
  async function envoyerCode() {
    const email = document.getElementById("email").value.trim().toLowerCase();
    const btn = document.getElementById("btnEmail");

    if (!email) {
      afficherMessage("Merci d'entrer ton adresse mail.");
      return;
    }

    if (!domaineValide(email)) {
      afficherMessage("Utilise ton adresse mail d'école (@" + DOMAINES_AUTORISES.join(" ou @") + ").");
      return;
    }

    btn.disabled = true;
    afficherMessage("Envoi en cours...");

    const { error } = await supabaseClient.auth.signInWithOtp({
      email: email,
      options: {
        shouldCreateUser: true
      }
    });

    btn.disabled = false;

    if (error) {
      afficherMessage("Erreur : " + error.message);
      return;
    }

    emailEnCours = email;
    document.getElementById("emailAffiche").textContent = email;
    afficherEtape(2);
  }

  // Étape 2 : vérification du code saisi
  async function verifierCode() {
    const code = document.getElementById("code").value.trim();
    const btn = document.getElementById("btnCode");

    if (!code) {
      afficherMessage("Merci d'entrer le code reçu par mail.");
      return;
    }

    btn.disabled = true;
    afficherMessage("Vérification...");

    const { data, error } = await supabaseClient.auth.verifyOtp({
      email: emailEnCours,
      token: code,
      type: "email"
    });

    btn.disabled = false;

    if (error) {
      afficherMessage("Code invalide ou expiré. Vérifie le code ou redemande-en un nouveau.");
      return;
    }

    // La connexion est réussie, on récupère l'utilisateur
    if (data && data.user) {
      gererSession(data.user);
    }
  }

  // Permet de valider avec la touche Entrée
  document.getElementById("code").addEventListener("keydown", (e) => {
    if (e.key === "Enter") verifierCode();
  });
  document.getElementById("email").addEventListener("keydown", (e) => {
    if (e.key === "Enter") envoyerCode();
  });
  document.getElementById("pseudo").addEventListener("keydown", (e) => {
    if (e.key === "Enter") validerPseudo();
  });

  // Après connexion : récupère le profil ou demande un pseudo
  async function gererSession(user) {
    if (sessionTraitee) return;
    sessionTraitee = true;

    const { data: etudiant, error } = await supabaseClient
      .from("etudiants")
      .select("*")
      .eq("auth_id", user.id)
      .maybeSingle();

    if (error) {
      sessionTraitee = false;
      afficherEtape(1);
      afficherMessage("Erreur : " + error.message);
      return;
    }

    if (etudiant) {
      localStorage.setItem("pseudo", etudiant.pseudo);
      localStorage.setItem("etudiant_id", etudiant.id);
      window.location.href = "pronostics.html";
    } else {
      // Première connexion : il doit choisir un pseudo
      afficherEtape(3);
    }
  }

  // Choix du pseudo (première connexion)
  async function validerPseudo() {
    const pseudo = document.getElementById("pseudo").value.trim();
    const btn = document.getElementById("btnPseudo");

    if (pseudo.length < 3) {
      afficherMessage("Le pseudo doit faire au moins 3 caractères.");
      return;
    }

    btn.disabled = true;

    const { data: { user } } = await supabaseClient.auth.getUser();

    // Vérifie que le pseudo n'est pas déjà pris
    const { data: pseudoPris } = await supabaseClient
      .from("etudiants")
      .select("id")
      .eq("pseudo", pseudo)
      .maybeSingle();

    if (pseudoPris) {
      afficherMessage("Ce pseudo est déjà pris, choisis-en un autre.");
      btn.disabled = false;
      return;
    }

    const { data: nouveau, error } = await supabaseClient
      .from("etudiants")
      .insert([{ pseudo: pseudo, email: user.email, auth_id: user.id }])
      .select()
      .single();

    btn.disabled = false;

    if (error) {
      afficherMessage("Erreur : " + error.message);
      return;
    }

    localStorage.setItem("pseudo", nouveau.pseudo);
    localStorage.setItem("etudiant_id", nouveau.id);
    window.location.href = "pronostics.html";
  }

  // Si l'étudiant est déjà connecté (session existante), on le redirige directement
  supabaseClient.auth.getSession().then(({ data: { session } }) => {
    if (session) {
      gererSession(session.user);
    }
  });
</script>

</body>
</html>
